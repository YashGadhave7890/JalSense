version: "3.8"

networks:
  jalsense-network:
    name: jalsense-network
    driver: bridge

services:
  # ===========================================================================
  # JalSense REST API Backend Service (FastAPI)
  # ===========================================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${DOCKERHUB_USERNAME:-jalsense}/jalsense-backend:${IMAGE_TAG:-1.0.0}
    container_name: jalsense-backend
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - API_PORT=8000
      - API_HOST=0.0.0.0
      - PYTHONUNBUFFERED=1
    volumes:
      # Shared access to data caches and trained ML artifacts
      - shared-data:/app/data
      - shared-artifacts:/app/artifacts
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - jalsense-network

  # ===========================================================================
  # JalSense Production Web Application (React + Vite + Nginx)
  # ===========================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ${DOCKERHUB_USERNAME:-jalsense}/jalsense-frontend:${IMAGE_TAG:-1.0.0}
    container_name: jalsense-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - jalsense-network

  # ===========================================================================
  # JalSense Decision-Support Dashboard (Streamlit - Preserved Auxiliary)
  # ===========================================================================
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${DOCKERHUB_USERNAME:-jalsense}/jalsense-dashboard:${IMAGE_TAG:-1.0.0}
    container_name: jalsense-dashboard
    restart: unless-stopped
    ports:
      - "${STREAMLIT_PORT:-8501}:8501"
    env_file:
      - .env
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_SERVER_HEADLESS=true
      - PYTHONUNBUFFERED=1
    volumes:
      - shared-data:/app/data
      - shared-artifacts:/app/artifacts
    command: streamlit run app/streamlit_app.py --server.port=8501 --server.address=0.0.0.0
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8501/_stcore/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 25s
    networks:
      - jalsense-network

volumes:
  shared-data:
    driver: local
  shared-artifacts:
    driver: local
